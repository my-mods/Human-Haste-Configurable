[Mod]
Id = HumanHasteConfigurable
Name = Human Haste - Configurable
Author = oOCamilleOo
Version = 1.0
Description = Human running during vampire Haste, with configurable speed.
ModURL = https://github.com/my-mods/Human-Haste-Configurable

[Setting.hasteSpeedPercent]
Id = hasteSpeedPercent
Type = percent
Label = Vampire haste speed
Description = 100% matches the vanilla wolf's forward haste speed. Enhanced vampire Haste keeps its bonus. Ordinary sprint and daytime Haste are unchanged.
Group = Haste
Minimum = 25
Maximum = 300
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hasteSpeedPercent

[Setting.logLevel]
Id = logLevel
Type = picker
Label = Logging
Description = Diagnostic messages in UE4SS.log. Debug records haste activation and speed changes.
Group = Logging
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
